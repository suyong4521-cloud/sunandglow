<style>
:root{--primary:#12324A;--accent:#24B5CF;--bg:#F6FBFC;--surface:#EDF3F5;--ink:#12324A;--soft:#A6D94C;--line:#DBE3E7;--on-primary:#FFFFFF;--on-accent:#FFFFFF;--radius:22px;--font-head:&#34;Pretendard Variable&#34;,Pretendard,system-ui,sans-serif;--font-body:&#34;Pretendard Variable&#34;,Pretendard,system-ui,sans-serif}

.wiped{display:inline-block;margin-top:22px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
